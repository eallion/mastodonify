<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f4f4f9;
    }
    .container {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: stretch;
    }
    
    /* The main action button */
    #notif-btn {
      flex: 1;
      height: 48px;
      padding: 12px 10px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      /* Initial background */
      background-color: #6364ff;
      /* Transition for smoother seconds updates */
      transition: background 0.2s linear;
    }

    #notif-btn:hover {
      /* Hover effect needs to blend with gradient, usually filters are easier */
      filter: brightness(1.1);
    }
    
    /* Settings Button */
    #settings-btn {
        background-color: #e0e0e0;
        color: #333;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        transition: background-color 0.2s;
    }
    #settings-btn:hover {
        background-color: #d0d0d0;
    }
    
    .setup-msg {
        text-align: center;
        margin-bottom: 10px;
    }
    .hidden {
        display: none;
    }
  </style>
</head>
<body>
  <div id="setup-view" class="hidden">
      <div class="setup-msg" data-i18n="setupMsg">Please configure Mastodonify</div>
      <button id="go-to-settings" style="width: 100%; background: #6364ff; color: white; padding: 10px; border:none; border-radius:9999px;" data-i18n="openSettingsBtn">Open Settings</button>
  </div>

  <div id="main-view" class="container hidden">
      <button id="notif-btn" data-i18n="checking">Checking...</button>
      <button id="settings-btn" title="Settings">⚙️</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
